name: 'scaffold-clean-architecture-docs'
on:
  release:
    types:
      - released
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ github.event_name == 'release' || steps.changes.outputs.docs == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Next steps will only run if generation code templates have been changed
      - name: Detect changes in generated code
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            docs:
              - 'docs/**'
      - name: Set release mode
        if: github.event_name == 'release'
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV
      - name: Setup Node.js
        if: github.event_name == 'release' || steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'docs/.nvmrc'
      - name: Install dependencies
        if: github.event_name == 'release' || steps.changes.outputs.docs == 'true'
        run: npm ci
        working-directory: docs
      - name: Build docs
        if: github.event_name == 'release' || steps.changes.outputs.docs == 'true'
        run: npm run build
        working-directory: docs
      - name: Upload artifact
        if: github.event_name == 'release' || steps.changes.outputs.docs == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'docs/build/'

  # A separate job, as GitHub recommends: in the same job, deploy-pages can query the artifact
  # before it is listed and fail with "No artifacts named github-pages were found"
  deploy:
    needs: build
    if: needs.build.outputs.docs == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1