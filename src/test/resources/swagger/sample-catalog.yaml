openapi: 3.0.1
info:
  title: Sample Library Catalog
  description: Fictional contract used only for plugin tests.
  version: 1.0.0
servers:
  - url: https://api.example.com/catalog/v1
paths:
  /books/search:
    post:
      summary: Search books in the catalog
      operationId: searchBooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bookSearch'
      responses:
        '200':
          description: Books found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bookDetail'
components:
  schemas:
    author:
      type: object
      description: Person who wrote a book
      properties:
        authorId:
          type: string
          example: AUT-001
        fullName:
          type: string
          example: Jane Placeholder
    bookSearch:
      type: object
      description: Filters used to search books
      required:
        - title
      properties:
        title:
          type: string
          example: Example Title
        author:
          $ref: '#/components/schemas/author'
    bookDetail:
      type: object
      description: Book returned by the catalog
      properties:
        isbn:
          type: string
          example: 000-0-00-000000-0
        pages:
          type: integer
          format: int32
          example: 250
          default: 10
        author:
          $ref: '#/components/schemas/author'
        coAuthors:
          type: array
          items:
            $ref: '#/components/schemas/author'
        tags:
          type: array
          description: Keywords used to classify the book
          items:
            type: string
          example:
            - fiction
            - classic
        publishedAt:
          type: string
          format: date-time
          description: Date and time the book was published
          example: '2020-05-17T10:30:00Z'
        price:
          type: number
          description: Retail price of the book
          example: 19.99
        availability:
          type: string
          description: Current loan status of the book
          enum:
            - AVAILABLE
            - BORROWED
            - LOST
    base:
      type: object
      description: Parent model in the same package as its child
      properties:
        id:
          type: string
    child:
      description: Inherits from base
      allOf:
        - $ref: '#/components/schemas/base'
        - type: object
          properties:
            name:
              type: string
    auditTrail:
      type: object
      description: Parent model that lives in the response package when configured
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
    loanRecord:
      allOf:
        - $ref: '#/components/schemas/auditTrail'
        - type: object
          properties:
            loanId:
              type: string
            dueDate:
              type: string
              format: date-time
            status:
              $ref: '#/components/schemas/loanStatus'
    loanStatus:
      type: string
      description: Status of a loan
      enum:
        - ACTIVE
        - RETURNED
        - OVERDUE
